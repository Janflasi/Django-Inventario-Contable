{% extends "core/base.html" %}
{% block title %}Mi Perfil{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <!-- Header -->
      <div class="text-center mb-5">
        <div class="avatar mb-3">
          <div class="bg-primary rounded-circle d-inline-flex align-items-center justify-content-center" 
               style="width: 60px; height: 60px;">
            <i class="fas fa-user text-white"></i>
          </div>
        </div>
        <h4 class="fw-bold text-dark mb-1">Mi Perfil</h4>
      </div>

      <!-- Card principal -->
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4">
          
          <!-- Usuario -->
          <div class="d-flex align-items-center mb-3 p-2 bg-light rounded-3">
            <div class="me-2">
              <i class="fas fa-user-circle text-primary"></i>
            </div>
            <div>
              <small class="text-muted d-block">Usuario</small>
              <strong>{{ user.username }}</strong>
            </div>
          </div>

          <!-- Nombre -->
          <div class="d-flex align-items-center mb-3 p-2 bg-light rounded-3">
            <div class="me-2">
              <i class="fas fa-id-card text-success"></i>
            </div>
            <div>
              <small class="text-muted d-block">Nombre</small>
              <strong>{{ user.first_name }} {{ user.last_name }}</strong>
            </div>
          </div>

          <!-- Email -->
          <div class="d-flex align-items-center mb-4 p-2 bg-light rounded-3">
            <div class="me-2">
              <i class="fas fa-envelope text-info"></i>
            </div>
            <div>
              <small class="text-muted d-block">Email</small>
              <strong>{{ user.email }}</strong>
            </div>
          </div>

          <!-- Botones -->
          <div class="d-grid gap-2">
            <a href="{% url 'perfil_editar' %}" class="btn btn-primary rounded-3">
              <i class="fas fa-edit me-1"></i>Editar
            </a>
            <a href="{% url 'cuenta_eliminar' %}" class="btn btn-outline-danger rounded-3"
               onclick="return confirm('¿Seguro que quieres eliminar tu cuenta?')">
              <i class="fas fa-trash me-1"></i>Eliminar
            </a>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
  .card {
    transition: transform 0.2s ease;
  }
  
  .card:hover {
    transform: translateY(-2px);
  }
  
  .bg-light {
    transition: background-color 0.2s ease;
  }
  
  .bg-light:hover {
    background-color: #f8f9fa !important;
  }
</style>
{% endblock %}
