{% extends 'core/base.html' %}
{% block title %}Categorías{% endblock %}

{% block content %}
<div class="container mt-5">
  <h2>Categorías de Productos</h2>
  <a href="{% url 'categoria_crear' %}" class="btn btn-success mb-3">Agregar Categoría</a>
  
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      {% for categoria in categorias %}
      <tr>
        <td>{{ categoria.nombre }}</td>
        <td>
          <a href="{% url 'categoria_editar' categoria.id %}" class="btn btn-sm btn-warning">Editar</a>
          <a href="{% url 'categoria_eliminar' categoria.id %}" class="btn btn-sm btn-danger">Eliminar</a>
        </td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="2" class="text-center">No hay categorías registradas.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
