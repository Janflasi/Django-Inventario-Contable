{% extends 'core/base.html' %}
{% block title %}Eliminar Producto{% endblock %}

{% block content %}
<div class="container mt-5">
  <h2>¿Estás seguro que deseas eliminar el producto?</h2>
  <p><strong>{{ producto.nombre }}</strong> de la categoría <strong>{{ producto.categoria.nombre }}</strong></p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a href="{% url 'productos_listar' %}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
